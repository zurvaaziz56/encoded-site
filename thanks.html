<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF9F5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FFB49A'/%3E%3Ctext x='16' y='22.5' font-family='Arial,sans-serif' font-weight='800' font-size='17' fill='%231D1A21' text-anchor='middle'%3Ee%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.classList.add('js');</script>
<title>Thank you · Encoded</title>
<meta name="robots" content="noindex">
</head>
<body class="page-simple">
<div class="aurora aurora--fixed" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="grain grain--fixed" aria-hidden="true"></div>
<header class="nav is-scrolled"><div class="wrap nav__inner"><a class="brand" href="/">encoded</a></div></header>
<main class="simple wrap" id="main">
  <section class="glass simple__card">
    <p class="pill" id="tstatus">Order received</p>
    <h1 class="simple__h1" id="ttitle">Thank you.</h1>
    <p class="lede" id="tlede">Your kit arrives in 2 business days.</p>
    <ol class="next">
      <li><b>1</b><span>We read your answers and your published work.</span></li>
      <li><b>2</b><span>We build and test your kit.</span></li>
      <li><b>3</b><span>You get it by email, with a 10-minute setup guide.</span></li>
    </ol>
    <p class="fine" id="torder"></p>
    <div class="ctas"><a class="btn" href="/">Back to home</a><a class="btn btn--glass" href="#" data-cta="book">Questions? Book a call</a></div>
  </section>
</main>
<script src="site.js" defer></script>
<script>
(function(){var q=new URLSearchParams(location.search),s=q.get('status'),o=q.get('order');
if(o)document.getElementById('torder').textContent='Your order number: '+o;
if(s==='received'){document.getElementById('tstatus').textContent='Answers received';document.getElementById('ttitle').textContent='Thank you. Almost there.';document.getElementById('tlede').textContent="We'll email you a payment link today. Your kit arrives 2 business days after payment.";}
else if(s==='paid'){document.getElementById('tstatus').textContent='Payment received';}})();
</script>
</body>
</html>
